name: Notion Issue Sync

# 実体はakariのreusable workflow。
# https://github.com/ningenMe/akari/blob/main/.github/workflows/notion-sync.yml
on:
  issues:
    types: [opened, edited, closed, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "再同期するIssue番号"
        required: true
        type: number

jobs:
  sync:
    concurrency:
      group: notion-sync-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    uses: ningenMe/akari/.github/workflows/notion-sync.yml@main
    secrets:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
